repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: large-files
        name: block large artifacts
        entry: sh -c 'git diff --cached --name-only | grep -E "\\.(parquet|html)$" && exit 1 || exit 0'
        language: system
        pass_filenames: false
