[project]
name = "samar-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "samar-engine",
  "samar-data",
  "samar-secrets",
  "samar-brokers",
  "samar-agent",
  "samar-contracts",
]

[tool.uv.sources]
samar-engine = { workspace = true }
samar-data = { workspace = true }
samar-secrets = { workspace = true }
samar-brokers = { workspace = true }
samar-agent = { workspace = true }
samar-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samar_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
