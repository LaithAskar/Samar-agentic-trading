[project]
name = "samar-contracts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "samar-engine"]

[tool.uv.sources]
samar-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samar_contracts"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
