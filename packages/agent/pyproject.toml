[project]
name = "samar-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["samar-engine", "pydantic>=2.9", "httpx>=0.28"]

[tool.uv.sources]
samar-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samar_agent"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
